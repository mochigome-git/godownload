AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Supabase goDownload Service Lambda with Function URL (behind CloudFront)

# Every runtime setting lives here. `sam deploy` resets the function to
# exactly this template, so anything changed only in the console is lost
# on the next deploy. Change settings here (or in .env), never in the console.

Globals:
  Function:
    Timeout: 300
    MemorySize: 512

Parameters:
  SupabaseUrl:
    Type: String
  SupabaseServiceKey:
    Type: String
    NoEcho: true
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, production]
  FlattenJsonb:
    Type: String
    Default: ""
  HiddenColumns:
    Type: String
    Default: ""
  JoinMappings:
    Type: String
    Default: ""
  StorageBucket:
    Type: String
    Default: godownload
  StorageExportPath:
    Type: String
    Default: exports/
  StorageExpiryHours:
    Type: String
    Default: "24"

Resources:
  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: godownload
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          ENV: !Ref Environment
          # Called via CloudFront: the Lambda sends CORS headers itself
          BEHIND_PROXY: "true"
          FLATTEN_JSONB: !Ref FlattenJsonb
          HIDDEN_COLUMNS: !Ref HiddenColumns
          JOIN_MAPPINGS: !Ref JoinMappings
          SUPABASE_STORAGE_BUCKET: !Ref StorageBucket
          SUPABASE_STORAGE_EXPORT_PATH: !Ref StorageExportPath
          SUPABASE_STORAGE_EXPIRY_HOURS: !Ref StorageExpiryHours
      FunctionUrlConfig:
        # Keep this matching what CloudFront expects:
        #   NONE    = public URL (current)
        #   AWS_IAM = only CloudFront (OAC) can call it
        AuthType: NONE
        # No Cors block: behind CloudFront the Lambda handles CORS
        # (BEHIND_PROXY=true). Two CORS sources = duplicate headers.
    Metadata:
      BuildMethod: makefile

  DownloadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${DownloadFunction}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Value: !GetAtt DownloadFunctionUrl.FunctionUrl
  FunctionArn:
    Value: !GetAtt DownloadFunction.Arn
